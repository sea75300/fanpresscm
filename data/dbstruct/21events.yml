## reminders table definition
---
name: events
primarykey: id
engine: InnoDB
charset: utf8
autoincrement:
    colname: id
    start: 1
cols:
    id:
        type: bigint
        length: 20
        params: NOT NULL
    event_name:
        type: varchar
        length: 255
        params: NOT NULL
    module_key:
        type: varchar
        length: 255
        params: NOT NULL
    class_name:
        type: varchar
        length: 512
        params: NOT NULL

indices:
    emc:
        col:
          event_name
          module_key
          class_name
        isUnqiue: true